<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Tarea</title>
    <!-- Asegúrate de que la ruta a tu CSS sea correcta -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <!-- Ejemplo de mensaje cuando el registro es exitoso (puedes activarlo con JS o dejarlo listo) -->
    <!-- <div class="registro-exitoso">¡Registro completado con éxito!</div> -->

    <form class="formulario-registro">
        <h2>Registro de Usuario</h2>
        
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" class="input-campo" required placeholder="Ingresa tu nombre">

        <label for="correo">Correo electrónico:</label>
        <input type="email" id="correo" class="input-campo" required placeholder="correo@ejemplo.com">

        <button type="submit" class="btn-enviar">Registrarse</button>
    </form>

</body>
</html>
